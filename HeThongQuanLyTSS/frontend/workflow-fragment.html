<header><a class="brand" href="index.html">Career Portal</a><span id="identity"></span><button id="logout" hidden>Đăng xuất</button></header>
<section id="auth" class="auth"><h1>Quản lý thực tập sinh</h1><p>Đăng nhập để xem công việc, lịch và báo cáo thực tập.</p>
<form id="login"><label>Loại tài khoản<select name="role"><option value="Intern">Thực tập sinh</option><option value="Staff">HR / Mentor / Quản trị viên</option></select></label><label>Email hoặc mã sinh viên<input name="identity" required autocomplete="username"></label><label>Mật khẩu<input name="password" type="password" required autocomplete="current-password"></label><button>Đăng nhập</button></form>
<details><summary>Đăng ký thực tập sinh</summary><form id="register"><label>Họ tên<input name="name" required maxlength="120"></label><label>Mã sinh viên<input name="studentId" required maxlength="40"></label><label>Email<input name="email" type="email" required></label><label>Trường<input name="school" required></label><label>Ngành<input name="major" required></label><label>Mật khẩu<input name="password" type="password" minlength="8" required></label><button>Đăng ký</button></form></details>
<details><summary>Khởi tạo quản trị viên lần đầu</summary><p>Nhập mã khởi tạo do người chạy máy chủ cấu hình.</p><form id="bootstrap"><label>Mã khởi tạo<input name="token" type="password" required></label><label>Họ tên<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Mật khẩu<input name="password" type="password" minlength="12" required></label><button>Tạo quản trị viên</button></form></details></section>
<div id="workspace" hidden><aside><nav id="nav"></nav></aside><main><div class="heading"><div><p class="eyebrow">KHÔNG GIAN LÀM VIỆC</p><h1 id="title"></h1></div><button id="create">Thêm mới</button></div><p id="description"></p><div id="toolbar"></div><section id="content"></section></main></div>
<p id="message" role="status" aria-live="polite"></p><dialog id="editor"><form id="edit-form"><h2 id="edit-title"></h2><div id="fields" class="fields"></div><p id="form-error" role="alert"></p><div class="buttons"><button type="button" id="cancel" class="secondary">Hủy</button><button id="save">Lưu</button></div></form></dialog>
